name: Deploy WordPress Theme to FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./rush-wp-theme-fixed/
          server-dir: /htdocs/wp-content/themes/rush-wp-theme-fixed/
          security: loose
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/.vscode/**
            README.md